<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Diagram showing the verification process - Scan, Analyze, Cross-check, Confirm - converging into a live verification hub</h2>
<style>
.hv-scene{
  --navy:#1a2b4a; --navy-2:#243a63; --gold:#c9963a; --white:#ffffff;
  --panel:#e8eef5; --node-border:#e3e8f0; --line:#c7d2e2; --label:#4a4a4a; --caption-text:#1a2b4a;
}
[data-mode="dark"] .hv-scene{ --line:#3a4a6a; --label:#c7cede; }
@media (prefers-color-scheme: dark){ :root:not([data-mode]) .hv-scene{ --line:#3a4a6a; --label:#c7cede; } }

.hv-visual{ position:relative; width:100%; max-width:560px; margin:0 auto; aspect-ratio:7/6.8; }
.hv-visual svg.hv-lines{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.hv-base{ fill:none; stroke:var(--line); stroke-width:1.5; opacity:.55; }
.hv-pulse{ fill:none; stroke-width:3; stroke-linecap:round; stroke:var(--gold); stroke-dasharray:0.10 1; stroke-dashoffset:1; }
@media (prefers-reduced-motion: no-preference){
  .hv-pulse{ animation: hv-flow 2.4s cubic-bezier(.45,0,.55,1) infinite; }
  .hv-pulse.d1{ animation-delay:0s; } .hv-pulse.d2{ animation-delay:.5s; }
  .hv-pulse.d3{ animation-delay:1s; } .hv-pulse.d4{ animation-delay:1.5s; }
  .hv-orb-ring{ animation:hv-spin 14s linear infinite; }
  .hv-orb-icon{ animation:hv-breathe 3.2s ease-in-out infinite; }
}
@keyframes hv-flow{ 0%{stroke-dashoffset:1;opacity:0;} 8%{opacity:1;} 88%{opacity:1;} 100%{stroke-dashoffset:-1;opacity:0;} }
@keyframes hv-spin{ to{ transform:rotate(360deg); } }
@keyframes hv-breathe{ 0%,100%{ transform:scale(1); opacity:.92; } 50%{ transform:scale(1.08); opacity:1; } }

.hv-node-wrap{ position:absolute; width:15.2%; }
.hv-node{ position:relative; width:100%; aspect-ratio:1/1; border-radius:20%; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(26,43,74,.14); }
.hv-node.dark{ background:linear-gradient(160deg,var(--navy-2),var(--navy)); }
.hv-node.light{ background:var(--white); border:1px solid var(--node-border); }
.hv-node svg{ width:42%; height:42%; overflow:visible; }
.hv-node.dark svg{ stroke:var(--white); }
.hv-node.light svg{ stroke:var(--navy); }
.hv-node-label{ position:absolute; top:calc(100% + 12px); left:50%; transform:translateX(-50%); font-size:12.5px; font-weight:600; letter-spacing:.01em; color:var(--label); white-space:nowrap; }

.n1{ left:2%; top:4%; } .n2{ left:27.5%; top:0%; } .n3{ left:53%; top:0%; } .n4{ left:78.5%; top:4%; }

.hv-orb-wrap{ position:absolute; left:50%; bottom:9%; transform:translateX(-50%); width:42%; aspect-ratio:1/1; }
.hv-orb-halo{ position:absolute; inset:-18%; border-radius:50%; background:radial-gradient(circle, rgba(201,150,58,.16) 0%, rgba(201,150,58,0) 70%); }
.hv-orb{ position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 34% 30%, #2f4570 0%, var(--navy) 60%, #131f38 100%); box-shadow:0 30px 60px rgba(26,43,74,.35), inset 0 0 40px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; }
.hv-orb-ring{ position:absolute; inset:12%; border-radius:50%; border:1.5px dashed rgba(201,150,58,.55); }
.hv-orb-icon{ width:30%; height:30%; stroke:var(--white); fill:none; stroke-width:1.6; position:relative; z-index:2; }
.hv-orb-caption{ position:absolute; top:calc(100% + 14px); left:50%; transform:translateX(-50%); font-size:12.5px; font-weight:600; color:var(--caption-text); background:var(--panel); padding:6px 14px; border-radius:20px; white-space:nowrap; }
</style>

<div class="hv-scene">
  <div class="hv-visual">
    <svg class="hv-lines" viewBox="0 0 700 620" preserveAspectRatio="xMidYMid meet">
      <path class="hv-base" d="M 84,132 C 84,232 350,232 350,358" />
      <path class="hv-base" d="M 262,88  C 262,220 350,220 350,358" />
      <path class="hv-base" d="M 440,88  C 440,220 350,220 350,358" />
      <path class="hv-base" d="M 618,132 C 618,232 350,232 350,358" />
      <path class="hv-pulse d1" pathLength="1" d="M 84,132 C 84,232 350,232 350,358" />
      <path class="hv-pulse d2" pathLength="1" d="M 262,88  C 262,220 350,220 350,358" />
      <path class="hv-pulse d3" pathLength="1" d="M 440,88  C 440,220 350,220 350,358" />
      <path class="hv-pulse d4" pathLength="1" d="M 618,132 C 618,232 350,232 350,358" />
    </svg>

    <div class="hv-node-wrap n1">
      <div class="hv-node dark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div class="hv-node-label">Scan</div>
    </div>

    <div class="hv-node-wrap n2">
      <div class="hv-node light">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2 7 4-15 2 8h6"/>
        </svg>
      </div>
      <div class="hv-node-label">Analyze</div>
    </div>

    <div class="hv-node-wrap n3">
      <div class="hv-node dark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="9" cy="12" r="2"/>
          <path d="M13 10h5M13 14h5"/>
        </svg>
      </div>
      <div class="hv-node-label">Cross-check</div>
    </div>

    <div class="hv-node-wrap n4">
      <div class="hv-node light">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div class="hv-node-label">Confirm</div>
    </div>

    <div class="hv-orb-wrap">
      <div class="hv-orb-halo"></div>
      <div class="hv-orb">
        <div class="hv-orb-ring"></div>
        <svg class="hv-orb-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M8 12l3 3 5-6"/>
        </svg>
      </div>
      <div class="hv-orb-caption">Presence verified</div>
    </div>
  </div>
</div>
